# Cuts the release package.json's version names, once: on a push to main whose version has no tag
# yet, a green check, then the pack's tree committed beside the pushed commit, on no branch, and
# tagged, with a GitHub release from CHANGELOG.md and the tarball attached. A push whose version is
# already tagged changes nothing.
# Adapted from spike-html-packages-sdk (9d10ca6): .github/workflows/release.yml, renamed and its
# pins current.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read the version and whether it is tagged
        id: version
        run: |
          tag="v$(jq -r .version package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released; nothing to do"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.released == 'false'
        uses: jdx/mise-action@v5.2.4

      - name: mise run install
        if: steps.version.outputs.released == 'false'
        run: mise run install

      - name: mise run check
        if: steps.version.outputs.released == 'false'
        run: mise run check

      - name: Pack, commit the pack's tree, and tag it
        id: tag
        if: steps.version.outputs.released == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          pnpm pack --pack-destination "$scratch"
          tarball=$(ls "$scratch"/*.tgz)
          tar -xzf "$tarball" -C "$scratch"
          # The pack's package/ as a tree: it is the work tree, through an index of its own, so the
          # checkout's index and .gitignore (which ignores dist/) play no part, and --force keeps
          # an ignore rule outside it, such as .git/info/exclude, from dropping a file. The
          # commit's one parent is the pushed one.
          export GIT_INDEX_FILE="$scratch/index"
          git --work-tree="$scratch/package" add --all --force .
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          commit=$(git commit-tree "$tree" -p "$GITHUB_SHA" -m "spike-html-apps-sdk $TAG")
          # The tagged tree is the tarball's package/, file for file.
          mkdir "$scratch/tagged"
          git archive "$commit" | tar -x -C "$scratch/tagged"
          diff -r "$scratch/package" "$scratch/tagged"
          git tag -a "$TAG" -m "spike-html-apps-sdk $TAG" "$commit"
          git push origin "refs/tags/$TAG"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        if: steps.version.outputs.released == 'false'
        uses: taiki-e/create-gh-release-action@v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          changelog: CHANGELOG.md
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - name: Attach the tarball
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          TARBALL: ${{ steps.tag.outputs.tarball }}
        run: gh release upload "$TAG" "$TARBALL"
