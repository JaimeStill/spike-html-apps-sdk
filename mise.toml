# Adapted from spike-html-packages-sdk (9d10ca6): mise.toml, renamed.
# Tasks never install a missing tool; mise run install is the one task that reads the network.
[settings]
task.run_auto_install = false

# The SDK's toolchain.
[tools]
actionlint = "1.7.12"
node = "26.12.1"
pnpm = "12.15.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }
# The NATS adapter's server, which test/unit/nats.test.js starts per suite on the loopback address.
# mise's registry maps nats-server to github:nats-io/nats-server.
nats-server = "2.15.2"

# The browser tier's browser. Chrome for Testing publishes no checksums: take the sha256 and size
# from the download by hand at each bump.
[tools."http:chrome-headless-shell"]
version = "156.0.8078.73"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:77eb8d52798efc7a857ab61abcc62a456d8ea9635b02341d06dffee2761768c8", size = "126938225" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing"
hide = true
run = "scripts/preflight.sh"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, shellcheck, and actionlint"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows"]

[tasks."lint:eslint"]
description = "Lint with ESLint, the layer's imports included"
depends = ["preflight"]
run = "pnpm exec eslint ."

[tasks."lint:format"]
description = "Check the format with Prettier"
depends = ["preflight"]
run = "pnpm exec prettier --check ."

[tasks."lint:shell"]
description = "Shellcheck the scripts"
run = "shellcheck scripts/*.sh"

# actionlint shellchecks each run: block too, with the shellcheck pinned above.
[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks.types]
description = "Type-check the sources with tsc"
run = "tsc --noEmit -p ."

[tasks.build]
description = "Build src/ into dist/: tsc's emit, with any handwritten .d.ts beside it"
run = "scripts/build.sh"

[tasks."test:unit"]
description = "Run the unit tier on the sources, the lint, a pack of the build, and the NATS adapter in the pinned nats-server"
depends = ["preflight nats", "build"]
run = "NATS_SERVER=$(mise which nats-server) node --test 'test/unit/*.test.js'"

[tasks."test:browser"]
description = "Run the browser tier on dist/ in the pinned chrome-headless-shell"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.js'"

[tasks.check]
description = "Run every check; reads no network; writes dist/"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

[tasks.install]
description = "Install the pins and node_modules; reads the network"
run = ["mise install", "pnpm install --frozen-lockfile"]

[tasks.currency]
description = "Report every mise tool, package.json pin, and action pin behind its latest, exiting nonzero if any"
run = "scripts/currency.sh"
quiet = true
